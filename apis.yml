description: >-
  OpenFIGI is your entry point to multiple tools for identifying, mapping and requesting a free Financial Instrument
  Global Identifier (FIGI). OpenFIGI is an open system for identifying instruments globally across all asset classes.
  Combining the FIGI with additional descriptive meta-data, firms are able to link fragmented proprietary symbologies,
  fill the gaps that remain to create a data lineage, streamline the trade workflow and reduce operational risk.
